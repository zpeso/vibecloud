# ServerMobs (1.8 build) - fake-player NPCs for Minecraft 1.8 backend servers.
#
# NPC definitions are persisted OUTSIDE the server directory so they survive the
# restarts/re-provisioning of non-static services. Point `data-directory` at the
# VibeCloud home directory (the folder that contains bridge.token); NPCs are then
# written to <data-directory>/servermobs/<npc>.yml.
#
# A cloud-managed service runs with services/<name>/ as its working directory, so
# the default "../../" resolves to the VibeCloud home. Adjust if you run this
# server from a different layout.
data-directory: "../../"

# The group this server belongs to. NPCs are tagged with the group they were
# created in and are only (re)spawned on services of that group. Leave empty to
# read it from plugins/VibeCloud/agent.properties (written by the cloud agent).
group: ""

# Hide the NPC from the player list (tab) after it has spawned. Recommended.
# NOTE (1.8): this is ignored on legacy servers, because removing the player-info entry is the
# only way to leave the tab list AND it also removes the entry the client reads the skin from.
remove-from-tablist: true

# Default for newly created NPCs: show the floating name above their head. Toggle per NPC
# with `/npc edit <name> nametag <true|false>`. Hide it when you place a hologram instead.
show-nametag: true

# Range (in blocks) at which an NPC is sent to a player.
view-distance: 48

# Layout of the hologram lines above the NPC.
# `offset` is the height of the top line above the NPC's feet — 2.0 is about where the
# NPC's nametag sits (the plugin compensates for the armour stand's own name height).
hologram:
  offset: 2.0
  line-spacing: 0.3

# Sign URL skins through MineSkin so the 1.8 client accepts them (it rejects unsigned textures).
# Without this a URL is used unsigned and shows as the default Steve/Alex skin.
sign-skins: true
mineskin-api: "https://api.mineskin.org"

# Proxy plugin-message channel used by the "transfer" action.
# 1.8 channel names cannot contain a colon, so the legacy server uses "BungeeCord" (which a
# Velocity proxy also listens on). A "bungeecord:main" value is remapped to "BungeeCord".
transfer-channel: "BungeeCord"
