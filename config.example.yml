# Group settings are reconciled continuously. Build keys pin exact upstream artifacts.
# Shared content: templates/every_server/ reaches every backend (Paper/Spigot), while
# templates/every_proxy/ reaches every proxy (Velocity/BungeeCord). They are layered over the
# build template; templates/groups/<group>/ is the final, group-specific overlay.
directories:
  templates: templates
  services: services

ports:
  start: 25565
  end: 25664

runtime:
  java-command: java
  min-memory-mb: 512
  max-memory-mb: 2048
  jvm-args: [ ]
  startup-timeout-seconds: 180
  shutdown-timeout-seconds: 30
  # The controller writes this choice to every Paper/Spigot service's eula.txt.
  # Read the Minecraft EULA (https://www.minecraft.net/eula) before keeping this enabled.
  eula-accepted: true

reconciliation:
  interval-seconds: 5

# Redis carries the agent bridge: backend agents publish their rosters there, the controller
# publishes the cloud status, and plugins read it from code. Redis must be reachable before the
# cloud starts — the default is a local server on the standard port. Credentials and a database
# can be given in the URL:
#   redis://127.0.0.1:6379
#   redis://:password@127.0.0.1:6379/2
#   rediss://redis.example.com:6380
redis:
  url: "redis://127.0.0.1:6379"

# Agent bridge settings: how often backends report, when an agent counts as offline, and the
# in-game service log. Agents are installed automatically into every backend service; the shared
# token is generated at bridge.token next to this file.
bridge:
  enabled: true
  heartbeat-interval-seconds: 5
  offline-timeout-seconds: 20

# Last-resort backend ("limbo"). Name an existing Paper/Spigot service and the cloud keeps it
# at the very end of the proxy's `try` list: when no other backend is reachable — the lobby is
# down, everything is still booting, the server a player was on crashed — the player is sent
# there instead of being refused. Leave empty to disable. What happens inside the limbo (sending
# players back to a live server) is up to the limbo's own plugin.
#   limbo: limbo-1
limbo: ""

# A fresh install starts with ZERO groups and services — a clean, empty cloud.
# Create everything with `group create` (guided wizard) and `service create` in the console.
# Example of what a configured groups block looks like afterwards:
# groups:
#   lobby:
#     type: PAPER
#     version: "paper-26.2-129"
#     min-services: 0
#     max-services: 5
#     always-running-services: 0
#     # Per-group heap ceiling (-Xmx) in MiB; omit to use runtime.max-memory-mb.
#     # Change at runtime with `group memory <name> <amount|default>` (e.g. 4G, 512m).
#     max-memory-mb: 4096
#     # Boot order: priority 1 starts first, then 2, 3, ... — the next priority only launches
#     # once the previous one's servers are running. Groups that omit it start last, together.
#     priority: 1
#   proxy:
#     type: VELOCITY
#     version: "velocity-4.0.0-6"
#     min-services: 0
#     max-services: 2
#     always-running-services: 0
