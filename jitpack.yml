# JitPack build configuration (https://jitpack.io/#zpeso/vibecloud)
#
# JDK selection goes through JitPack's own `jdk` field. The previous
# `sdk install java 21.0.4-tem` / `sdk use` pin made the build fail before Gradle
# even started ("Error: An unexpected error occurred while trying to open file
# .../gradle-wrapper.jar") on the current build image, so it is gone.
#
# Gradle 9.8 needs Java 17+ to launch; the project's Java 25 compile toolchain is
# provisioned automatically by the foojay-resolver-convention plugin
# (settings.gradle.kts) on top of this launcher JDK.
jdk:
  - openjdk21
install:
  - ./gradlew publishToMavenLocal
