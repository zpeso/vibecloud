name: Release

# Triggered by pushing a vX.Y.Z tag (the `release` Gradle task does this).
# Runs the test suite, builds the release zip, attaches it to a GitHub Release,
# and kicks JitPack so the published API artifacts are rebuilt from this tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      # gradlew is committed from Windows without the executable bit; always go
      # through bash so this can never break CI regardless of file mode.
      - name: Test
        run: bash gradlew test

      # Also builds the standalone ServerMobs plugin jars (modern + legacy) into build/dist/.
      - name: Build release artifacts
        run: bash gradlew :launcher:releaseZip

      - name: Attach zip and plugin jars to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/dist/vibecloud-*.zip
            build/dist/ServerMobs*.jar
          generate_release_notes: true
          fail_on_unmatched_files: true

      # Requesting build.log is what enqueues the build on JitPack. We deliberately do not
      # wait for it: a cold build takes minutes and would only stall this job. A short
      # timeout is enough to register the request; the build then completes asynchronously.
      #
      # JitPack canonicalises this repo's tags to the version WITHOUT the leading "v": it
      # publishes com.github.zpeso.vibecloud:<module>:X.Y.Z and resolves the build by that
      # name. Asking for the "vX.Y.Z" path 404s and enqueues nothing, which is why releases
      # never built. Strip the "v" with ${GITHUB_REF_NAME#v}.
      #
      # For a brand-new version the request legitimately blocks until --max-time while the
      # build is queued, so a non-zero exit here is expected and not a failure.
      - name: Kick JitPack (API artifacts)
        run: |
          # JitPack keys builds by the name it is asked for, so request both forms: the tag
          # (`v2.0.1`) and the unprefixed semver (`2.0.1`). Whichever it canonicalises, users can
          # resolve the coordinate their build file names.
          for version in "${GITHUB_REF_NAME}" "${GITHUB_REF_NAME#v}"; do
            curl -fsSL --max-time 60 \
              "https://jitpack.io/com/github/zpeso/vibecloud/${version}/build.log" \
              -o /dev/null || echo "JitPack build for ${version} requested — it completes asynchronously."
          done
