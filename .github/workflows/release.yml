name: Release

# Triggered by pushing a vX.Y.Z tag (the `release` Gradle task does this).
# Runs the test suite, builds the release zip, attaches it to a GitHub Release,
# and kicks JitPack so the published API artifacts are rebuilt from this tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      # gradlew is committed from Windows without the executable bit; always go
      # through bash so this can never break CI regardless of file mode.
      - name: Test
        run: bash gradlew test

      # Also builds the standalone ServerMobs plugin jars (modern + legacy) into build/dist/.
      - name: Build release artifacts
        run: bash gradlew :launcher:releaseZip

      - name: Attach zip and plugin jars to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/dist/vibecloud-*.zip
            build/dist/ServerMobs*.jar
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Kick JitPack (API artifacts)
        run: |
          curl -fsSL --max-time 300 \
            "https://jitpack.io/com/github/zpeso/vibecloud/${GITHUB_REF_NAME}/build.log" \
            -o /dev/null || echo "JitPack poll ended — it still builds lazily on first resolve."
